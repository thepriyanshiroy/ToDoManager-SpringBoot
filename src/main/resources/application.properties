spring.application.name=toDo

# Server Port
server.port=8080

# MySQL Database Configuration
# Change 'root' and 'your_password' to match your MySQL setup
spring.datasource.url=jdbc:mysql://localhost:3306/todo_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA Configuration
# 'update' automatically creates or updates the tables without deleting existing data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Scalar API Documentation Configuration
scalar.enabled=true
scalar.url=/v3/api-docs
scalar.path=/scalar
scalar.pageTitle=ToDo API Reference
